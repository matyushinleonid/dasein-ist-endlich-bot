services:
  dasein:
    build:
      dockerfile: Dockerfile
      context: .
    image: matyushinleonid/dasein-ist-endlich-bot:latest
    command: listener --config-path /configs/local.yaml
    env_file:
      - .env
    volumes:
      - ./configs/dummy.yaml:/configs/local.yaml
    depends_on:
      - mongodb
      - redis
    networks:
      - dasein_ist_endlich_network

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    networks:
      - dasein_ist_endlich_network

  redis:
    image: redis:7.4.2
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - dasein_ist_endlich_network

networks:
  dasein_ist_endlich_network:
    driver: bridge
